[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fu-board"
version = "0.1.0"
description = "A follow-up board for parked work: park a task, group it into jobs, and resume the exact Claude Code or Copilot session later."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Quinn" }]
keywords = ["cli", "tui", "todo", "claude-code", "copilot", "agent-skill"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["textual>=0.86"]

[project.urls]
Homepage = "https://github.com/josh-quinn/fu"
Issues = "https://github.com/josh-quinn/fu/issues"
Changelog = "https://github.com/josh-quinn/fu/blob/main/CHANGELOG.md"

[project.scripts]
fu = "fu.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fu"]
exclude = ["**/evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["default_scratch_rules: keep the temp-folder rule of fu.artifacts switched on"]

[tool.coverage.run]
source = ["fu"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/fu/skills/*/evals"] # fixtures for the skill evals, not project code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = [
  "S606", # os.execvp is the point of `fu resume`: it replaces the process with the saved restart command
  "S603", # subprocess is only used with a fixed argv (pbcopy)
  "S607", # pbcopy is resolved from PATH on purpose
  "E501", # long lines in the Textual markup strings; the formatter handles code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
