# Tag-driven release: vX.Y.Z on main -> tested sdist + wheel, checksums, SBOM, signed
# build-provenance attestation, and SLSA provenance, all attached to the GitHub Release.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # per job as well as top level (OSPS-AC-04.02)
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must be on main and match the package version
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $have"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: make check
      - run: make build
      - run: sh scripts/verify-dist.sh
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: SBOM (dependencies from uv.lock)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/fu-board-${{ github.ref_name }}.sbom.spdx.json
          upload-artifact: false
      - name: Subjects for SLSA provenance
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum -- *.tar.gz *.whl | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore signing for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

  provenance:
    name: SLSA provenance
    needs: [build, release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Must be referenced by tag, not SHA: slsa-verifier checks the builder's tag (docs/adr/0006).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
