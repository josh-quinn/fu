name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # per job as well as top level (OSPS-AC-04.02)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.14"} # what Homebrew installs it with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false # no cache restore into a job that builds a release candidate
      - run: uv sync --locked
      - run: make check

  build:
    name: build (sdist, wheel)
    runs-on: ubuntu-latest
    permissions:
      contents: read # per job as well as top level (OSPS-AC-04.02)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build
      - run: sh scripts/verify-dist.sh
      - name: Rebuild and compare bit for bit (reproducible build)
        run: |
          uv build --out-dir "$RUNNER_TEMP/again"
          for f in dist/*.tar.gz dist/*.whl; do cmp "$f" "$RUNNER_TEMP/again/$(basename "$f")"; done
